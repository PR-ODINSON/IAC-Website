<svg viewBox="0 0 250 73" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" 
x="0px" y="0px" width="250" height="73">
<style>
#svg_logo {
  clip-path: url(#clipping_logo);
}

svg .anim-rect{
  animation-name: logoMoves;
  animation-duration: 5s;
  animation-timing-function: linear;
  animation-direction: forwards;
  animation-delay: 0s;
  animation-iteration-count: infinite;
}

@keyframes logoMoves { 
  0% { transform: translateX(0); }
  100%   { transform: translateX(480px); }
}
</style>
	<clipPath id="clipping_logo">
