		letter-spacing="4" id="svg_logo" stroke-width="5" stroke="#000" fill="#fff">iNDEXTb</text>
  	</clipPath>
	<text x="50%" y="53" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="0.3" stroke-width="1" fill="#fff" lengthAdjust="250" >INVESTMENT PROMOTION ORGANISATION</text>
	<rect x="5" y="58" width="240" height="15" fill="#14679C" />
